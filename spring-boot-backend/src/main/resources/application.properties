# ===================================================================
# CAMPUS LOST & FOUND — SPRING BOOT + TIDB CLOUD (MYSQL) CONFIG
# Uses Environment Variables for Render + TiDB Cloud + Vercel
# ===================================================================
spring.application.name=veritas-lost-found-api
server.port=${PORT:8080}

# TiDB Cloud / MySQL Datasource Configuration (via Environment Variables)
# Example DB_URL for TiDB Cloud:
# jdbc:mysql://gateway01.us-west-2.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:4000/campus_lost_found_db?createDatabaseIfNotExist=true&sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings for TiDB Cloud Serverless
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate Settings (Automatically creates/updates tables in TiDB Cloud)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Increase max HTTP POST size to 15MB for base64 item image uploads
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
server.tomcat.max-http-form-post-size=15MB
spring.codec.max-in-memory-size=15MB

# Stateless JWT Security Settings (Must be at least 32 characters)
app.security.jwt.secret-key=${JWT_SECRET:VeritasCampusLostAndFoundJwtSecretKey2026SecureHmacSha256Key}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins (Comma-separated list of Vercel frontend URLs)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}
